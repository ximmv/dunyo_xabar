<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin kirish — Dunyo Xabar</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-body">
<div class="login-box">
  <div class="logo" style="justify-content:center;margin-bottom:24px;">
    <span class="logo-mark">DX</span>
    <span class="logo-text">Dunyo<em>Xabar</em></span>
  </div>
  <h1>Admin panelga kirish</h1>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash-box">{% for m in messages %}<p>{{ m }}</p>{% endfor %}</div>
    {% endif %}
  {% endwith %}
  <form method="post">
    <label>Login
      <input type="text" name="username" required autofocus>
    </label>
    <label>Parol
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn-primary">Kirish</button>
  </form>
  <a class="back-link" href="{{ url_for('home') }}">&larr; Saytga qaytish</a>
</div>
</body>
</html>
